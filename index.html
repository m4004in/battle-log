<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/battle-log/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="포켓몬 카드게임 대회 승패 기록 앱">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#EF4444">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Battle Log">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Battle Log</title>
  <link rel="manifest" href="manifest.json">

  <!-- 한글 폰트: 앱이 뜨기 전에 미리 받아둔다 -->
  <link rel="preload" href="assets/assets/fonts/NotoSansKR-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansKR-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FAFAFA;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFA;
      z-index: 9999;
      transition: opacity 200ms ease-out;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    /* 스피너: 폰트 없이 그려지므로 두부현상과 무관하다 */
    #boot-splash .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #E5E7EB;
      border-top-color: #EF4444;
      animation: bootspin 800ms linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-splash"><div class="spinner"></div></div>
  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      var removed = false;
      var signalReceived = false;

      function removeSplash() {
        if (removed || !splash) return;
        removed = true;
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 260);
      }

      // ── 1) Dart(Flutter) 신호: 폰트 등록 + 첫 프레임 이후 호출된다 ──
      window.blBootReady = function () {
        signalReceived = true;
        removeSplash();
      };

      // ── 2) 보조 감지: 신호가 오지 않는 비정상 상황에서만 작동한다.
      //      (뷰가 생겼다고 바로 걷으면 폰트가 준비되기 전 프레임이 노출되어
      //       두부현상이 다시 생기므로, 충분히 기다린 뒤에만 걷는다)
      function pollView() {
        if (removed) return;
        var view = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
        if (view && Date.now() - start > 6000) {
          requestAnimationFrame(function () {
            requestAnimationFrame(removeSplash);
          });
          return;
        }
        requestAnimationFrame(pollView);
      }
      var start = Date.now();
      requestAnimationFrame(pollView);

      // ── 3) 안전장치: 12초 뒤엔 무조건 걷는다 ──
      setTimeout(removeSplash, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
