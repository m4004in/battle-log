publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  provider: 6.1.5+1
  http: 1.5.0
  intl: ^0.19.0
  web: 1.1.1
  archive: 3.6.1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/bg/bg.png
